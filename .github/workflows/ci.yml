name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Unit tests
        run: mvn -B verify
      - name: One-node Redis Cluster smoke test
        run: ./scripts/smoke-test.sh
      - name: Multi-gateway end-to-end test
        run: bash ./scripts/e2e-multi-gateway.sh
